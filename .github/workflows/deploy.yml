name: Build and Deploy Microservice

on:
  push:
    branches:
      - main
      - 1nuevas_integraciones_kafka

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: 726357411862

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Extraer nombre del repositorio
        id: repo_name
        run: echo "REPO_NAME=${GITHUB_REPOSITORY#*/}" >> $GITHUB_ENV

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Autenticarse en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construir y Subir imagen Docker a Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.REPO_NAME }}
          IMAGE_TAG: latest
        run: |
          docker build --no-cache -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Desplegar en la Instancia EC2 mediante SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_SESSION_TOKEN,AWS_REGION
          script: |
            export AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            export AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            export AWS_SESSION_TOKEN=${{ secrets.AWS_SESSION_TOKEN }}
            export AWS_DEFAULT_REGION=us-east-1
            
            aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 726357411862.dkr.ecr.us-east-1.amazonaws.com
            
            cd ~/app
            docker compose -f docker-compose.prod.yml stop ${{ env.REPO_NAME }}
            docker compose -f docker-compose.prod.yml rm -f ${{ env.REPO_NAME }}
            docker rmi 726357411862.dkr.ecr.us-east-1.amazonaws.com/${{ env.REPO_NAME }}:latest || true
            docker compose -f docker-compose.prod.yml pull ${{ env.REPO_NAME }}
            docker compose -f docker-compose.prod.yml up -d ${{ env.REPO_NAME }}
            docker image prune -f